<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      user-scalable=no plus maximum-scale=1 stop Android from turning a
      pinch gesture into a page zoom that would fight Leaflet's own pinch
      handling (see WEBVIEW SECURITY SETTINGS PINNED / PAN, ZOOM AND
      GESTURE OWNERSHIP in the ticket).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <!--
      Relative references only - no http(s) <script>/<link> tag, so there
      is no CDN fetch for the Leaflet library. These resolve against this
      document's file:///android_asset/leaflet/ base URL, which is why
      this is loaded as a `uri` source and never as `source={{ html }}`
      (an inline document has no base URL).
    -->
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
      /*
        The actual Android pan fix: a document sized exactly to the
        viewport, with nothing to scroll, so the WebView never starts a
        page scroll and Leaflet owns the drag. There is no Android
        `scrollEnabled` prop to reach for instead - it is iOS/macOS only.
      */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #map {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }

      /*
        Nudges the OSM attribution control off the bottom-right corner so
        it clears ViewPane's Card, which is overflow:hidden with an 8px
        (token $3) rounded corner on-device - a flush-to-the-corner chip
        would be clipped by that arc. leaflet.css:413-416 sets `margin: 0`
        on this exact selector and, at equal specificity but later in the
        file, beats .leaflet-bottom/.leaflet-right's own 10px margins, so
        this rule has to live here (parsed after the <link>, so it wins)
        rather than in leaflet.css, which stays byte-identical to the
        pinned npm package (see the README's Leaflet section). 6px clears an
        8px-radius corner's ~2.34px inset with margin to spare, and is a
        CSS literal, not a map coordinate/zoom/tile-URL/attribution
        string - it says nothing about where Chicago is.
      */
      .leaflet-container .leaflet-control-attribution {
        margin-bottom: 6px;
        margin-right: 6px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      // One grep-able tag shared by every diagnostic line this feature
      // logs, so `adb logcat -d | grep CupboardMap` is the single
      // diagnostic command. Mirrors mapConstants.ts's MAP_LOG_TAG, but a
      // tag string is not a map parameter (coordinate/zoom/tile
      // URL/attribution), so it is not subject to the no-duplication
      // rule those values carry.
      var TAG = '[CupboardMap]';

      // Bounds how many times the deferred init-view guard below will
      // re-check #map's size before giving up and applying anyway. A
      // named cap, not a magic number in the loop.
      var INIT_VIEW_MAX_ATTEMPTS = 30;

      // Throttle + hard cap for the tileerror handler: an offline device
      // or a blocked/rate-limited OSM endpoint can otherwise fail every
      // tile forever, which without a cap would log a summary line every
      // few seconds for the entire life of the session.
      var TILE_ERROR_POST_INTERVAL_MS = 5000;
      var TILE_ERROR_MAX_POSTS = 20;

      // Guarded so a reporting call can never itself throw - this helper
      // is used from window.onerror, where a throw would be swallowed
      // silently by the browser.
      function post(message) {
        if (
          typeof window.ReactNativeWebView !== 'undefined' &&
          window.ReactNativeWebView &&
          typeof window.ReactNativeWebView.postMessage === 'function'
        ) {
          window.ReactNativeWebView.postMessage(TAG + ' ' + message);
        }
      }

      // Bridges in-page errors out via postMessage -> onMessage -> one JS
      // console.warn, because in-page console.* is swallowed by
      // RNCWebChromeClient in release builds, while JS-side console
      // output is not.
      window.onerror = function (message, source, lineno, colno, error) {
        post(
          'window.onerror: ' +
            message +
            ' (' +
            source +
            ':' +
            lineno +
            ':' +
            colno +
            ')',
        );
        return false;
      };

      // Layer 1 of the diagnosable failure path: Leaflet failed to load
      // (e.g. the leaflet.js asset is missing), so `L` never exists.
      if (typeof L === 'undefined') {
        post('map.html: L is undefined - leaflet.js did not load');
      }

      // Called by the WebView's injectedJavaScript (see
      // src/map/mapInitScript.ts). Takes one JSON-serialisable config
      // object; carries no coordinate, zoom, tile URL or attribution
      // string of its own - every value here comes from the caller.
      window.initLeafletMap = function (config) {
        if (typeof L === 'undefined') {
          post('initLeafletMap: L is undefined - leaflet.js did not load');
          return;
        }
        try {
          var map = L.map('map', {
            center: [config.latitude, config.longitude],
            zoom: config.zoom,
            zoomControl: true,
            // CUPBOARD-4: a shared <canvas> per pane instead of one SVG
            // <path> per feature - load-bearing for the 10,760-point bus
            // stops layer (AC15), not a cosmetic choice.
            preferCanvas: !!config.preferCanvas,
          });

          var tileLayer = L.tileLayer(config.tileUrlTemplate, {
            maxZoom: config.maxZoom,
            attribution: config.attributionHtml,
          }).addTo(map);

          // ---------------------------------------------------------
          // CUPBOARD-4: independently toggleable data layers.
          //
          // A custom pane for the neighbourhood polygons, given a
          // z-index BELOW the default overlay pane (400, where rail
          // lines/bus routes render) and the default marker pane (600,
          // where circleMarker rail stations/bus stops render) - so
          // neighbourhoods always render beneath all four CTA layers
          // (AC13), regardless of which order the layers were toggled
          // on in. Using pane z-index instead of bringToBack()/
          // bringToFront() calls means toggling a CTA layer on AFTER
          // neighbourhoods can never need a re-stacking call.
          // ---------------------------------------------------------
          var neighbourhoodPane = map.createPane(config.neighbourhoodPane.name);
          neighbourhoodPane.style.zIndex = config.neighbourhoodPane.zIndex;

          // One entry per configured layer; `state` is 'idle' (never
          // requested) -> 'loading' (<script> tag injected, data not
          // back yet) -> 'loaded' (data cached, may or may not be on
          // the map right now) or 'error' (the <script> failed - the
          // picker shows "(unavailable)" and a retry re-requests it).
          var layersById = {};
          (config.layers || []).forEach(function (layerConfig) {
            layersById[layerConfig.id] = {
              config: layerConfig,
              state: 'idle',
              rawData: null,
              leafletLayer: null,
            };
          });
          var desiredLayerIds = [];

          // Builds the actual Leaflet layer for one already-loaded
          // layer id. Every vector gets `interactive: false` (AC13: the
          // neighbourhood fills - and, for consistency, every other
          // layer - must never swallow a pan/zoom gesture) and every
          // colour/weight/style number comes from `config`, never a
          // literal here.
          function buildLeafletLayerFor(id, geojson) {
            if (id === 'cta-rail-lines') {
              return L.geoJSON(geojson, {
                interactive: false,
                style: function (feature) {
                  var lines = feature && feature.properties && feature.properties.lines;
                  var colour =
                    (lines && config.railColourByName[lines]) || config.busRouteColour;
                  return {color: colour, weight: config.railLineWeight, interactive: false};
                },
              });
            }
            if (id === 'cta-bus-routes') {
              return L.geoJSON(geojson, {
                interactive: false,
                style: function () {
                  return {
                    color: config.busRouteColour,
                    weight: config.busRouteWeight,
                    interactive: false,
                  };
                },
              });
            }
            if (id === 'chicago-bike-routes') {
              return L.geoJSON(geojson, {
                interactive: false,
                style: function () {
                  return {
                    color: config.bikeRouteColour,
                    weight: config.bikeRouteWeight,
                    interactive: false,
                  };
                },
              });
            }
            if (id === 'cta-rail-stations') {
              return L.geoJSON(geojson, {
                interactive: false,
                pointToLayer: function (feature, latlng) {
                  var style = Object.assign({}, config.stationStyle, {interactive: false});
                  return L.circleMarker(latlng, style);
                },
              });
            }
            if (id === 'cta-bus-stops') {
              return L.geoJSON(geojson, {
                interactive: false,
                pointToLayer: function (feature, latlng) {
                  var style = Object.assign({}, config.busStopStyle, {interactive: false});
                  return L.circleMarker(latlng, style);
                },
              });
            }
            if (id === 'chicago-neighbourhoods') {
              // CUPBOARD-5: per-feature colouring, keyed on the stable
              // polygon key `pri_neigh` against config.neighbourhoodStyleByArea
              // (built by src/map/neighbourhoodColours.ts from the 17
              // passport neighbourhoods' colour pairs), falling back to
              // config.neighbourhoodStyle (CUPBOARD-4's default) for
              // every area with no passport neighbourhood. A missing or
              // empty dictionary would otherwise silently grey all 98
              // polygons with no visible error, so that case posts a
              // diagnostic once rather than failing silently.
              var styleByArea = config.neighbourhoodStyleByArea;
              if (!styleByArea || Object.keys(styleByArea).length === 0) {
                post('chicago-neighbourhoods: neighbourhoodStyleByArea is missing or empty - every polygon will use the default style');
              }
              return L.geoJSON(geojson, {
                interactive: false,
                pane: config.neighbourhoodPane.name,
                style: function (feature) {
                  var area = feature && feature.properties && feature.properties.pri_neigh;
                  var style = (area && styleByArea && styleByArea[area]) || config.neighbourhoodStyle;
                  return Object.assign({}, style, {interactive: false});
                },
              });
            }
            return null;
          }

          // Derives the attribution set from which layers are currently
          // LOADED AND DESIRED (AC22) - never an increment/decrement
          // counter, which double-decrements across remounts/retries.
          // Recomputed, not toggled, on every call.
          function updateCredits() {
            var ctaVisible = false;
            var chicagoVisible = false;
            desiredLayerIds.forEach(function (id) {
              var entry = layersById[id];
              if (!entry || entry.state !== 'loaded') {
                return;
              }
              if (entry.config.creditGroup === 'cta') {
                ctaVisible = true;
              } else if (entry.config.creditGroup === 'chicago') {
                chicagoVisible = true;
              }
            });
            map.attributionControl.removeAttribution(config.creditTexts.cta);
            map.attributionControl.removeAttribution(config.creditTexts.chicago);
            if (ctaVisible) {
              map.attributionControl.addAttribution(config.creditTexts.cta);
            }
            if (chicagoVisible) {
              map.attributionControl.addAttribution(config.creditTexts.chicago);
            }
          }

          // Applies (or un-applies) AC15's dormant bus-stops zoom gate.
          // A no-op whenever config.busStopsMinZoom is null, which is
          // what ships - see mapConstants.ts's BUS_STOPS_MIN_ZOOM.
          function applyBusStopsZoomGate() {
            if (config.busStopsMinZoom == null) {
              return;
            }
            var entry = layersById['cta-bus-stops'];
            if (!entry || !entry.leafletLayer) {
              return;
            }
            var shouldShow = map.getZoom() >= config.busStopsMinZoom;
            var isShown = map.hasLayer(entry.leafletLayer);
            if (shouldShow && !isShown) {
              entry.leafletLayer.addTo(map);
            } else if (!shouldShow && isShown) {
              map.removeLayer(entry.leafletLayer);
            }
          }
          if (config.busStopsMinZoom != null) {
            map.on('zoomend', applyBusStopsZoomGate);
          }

          function addLayerToMap(id) {
            var entry = layersById[id];
            if (!entry || entry.leafletLayer || !entry.rawData) {
              return;
            }
            var layer = buildLeafletLayerFor(id, entry.rawData);
            if (!layer) {
              post('layer-error: unbuildable-layer:' + id);
              return;
            }
            entry.leafletLayer = layer;
            if (id === 'cta-bus-stops' && config.busStopsMinZoom != null) {
              applyBusStopsZoomGate();
            } else {
              layer.addTo(map);
            }
            updateCredits();
          }

          function loadLayerScript(id) {
            var entry = layersById[id];
            if (!entry) {
              return;
            }
            var script = document.createElement('script');
            // Relative to this document, same as leaflet.css/leaflet.js
            // above - resolves inside file:///android_asset without
            // needing allowFileAccess*/allowUniversalAccessFromFileURLs
            // (see MapScreen.tsx's header comment for why that matters
            // and why those flags stay unset).
            script.src = config.mapDataDir + entry.config.assetFile;
            script.onerror = function () {
              entry.state = 'error';
              post('layer-error: ' + id);
              updateCredits();
            };
            document.head.appendChild(script);
          }

          // Called by each mapdata/*.geojson.js asset (see
          // tools/mapDataConversion.js's wrapAsRegisterLayerScript) once
          // its <script> tag finishes loading. RE-CHECKS the current
          // desired set before adding anything to the map - fixes the
          // load/toggle race where a layer is toggled off again while
          // its data is still in flight.
          window.cupboardRegisterLayer = function (id, geojson) {
            var entry = layersById[id];
            if (!entry) {
              post('layer-error: unknown-layer:' + id);
              return;
            }
            entry.rawData = geojson;
            entry.state = 'loaded';
            if (desiredLayerIds.indexOf(id) !== -1) {
              addLayerToMap(id);
            }
            updateCredits();
          };

          // Called by MapScreen.tsx (see src/map/mapInitScript.ts's
          // buildSetLayersScript()) with the FULL set of layer ids that
          // should be visible right now - on every toggle, and again
          // with the full enabled set on every init-ok heartbeat after a
          // remount (AC11/AC12). Idempotent: calling it twice with the
          // same ids is a no-op the second time.
          window.cupboardSetLayers = function (ids) {
            desiredLayerIds = (ids || []).slice();
            Object.keys(layersById).forEach(function (id) {
              var entry = layersById[id];
              var wanted = desiredLayerIds.indexOf(id) !== -1;
              if (!wanted && entry.leafletLayer) {
                map.removeLayer(entry.leafletLayer);
                entry.leafletLayer = null;
              }
            });
            desiredLayerIds.forEach(function (id) {
              var entry = layersById[id];
              if (!entry || entry.leafletLayer) {
                return;
              }
              if (entry.state === 'loaded') {
                addLayerToMap(id);
              } else if (entry.state === 'idle' || entry.state === 'error') {
                entry.state = 'loading';
                loadLayerScript(id);
              }
            });
            updateCredits();
          };

          // Tile-fetch failure (no network, a blocked endpoint, OSM
          // rate-limiting) is accepted as degraded-but-silent for this
          // ticket: no error/retry UI is built, but the condition must
          // stay diagnosable from logs. The first failure posts with the
          // failing tile's URL; after that, at most one throttled
          // summary line per TILE_ERROR_POST_INTERVAL_MS carrying the
          // running count, up to TILE_ERROR_MAX_POSTS, after which this
          // goes silent - an unbounded window would otherwise log every
          // few seconds for the life of the session while offline.
          var tileErrorCount = 0;
          var tileErrorPostCount = 0;
          var tileErrorLastPostAt = 0;
          tileLayer.on('tileerror', function (e) {
            tileErrorCount += 1;
            if (tileErrorPostCount >= TILE_ERROR_MAX_POSTS) {
              return;
            }
            if (tileErrorPostCount === 0) {
              post(
                'tile-error: first failure, count=' +
                  tileErrorCount +
                  ', url=' +
                  (e && e.tile && e.tile.src ? e.tile.src : 'unknown'),
              );
              tileErrorPostCount += 1;
              tileErrorLastPostAt = Date.now();
              return;
            }
            var now = Date.now();
            if (now - tileErrorLastPostAt >= TILE_ERROR_POST_INTERVAL_MS) {
              post('tile-error: count=' + tileErrorCount);
              tileErrorPostCount += 1;
              tileErrorLastPostAt = now;
            }
          });

          // The injectedJavaScript that calls this function runs once
          // the page's own "load" event fires, which can be before the
          // native Android WebView has finished its own layout pass -
          // this #map div can still measure 0x0 (or a stale size) at
          // the instant L.map() reads it. Leaflet bakes that size into
          // its initial pixel transform, so the map renders with the
          // wrong area in view (center pinned near the container's
          // top-left instead of its middle) even though center/zoom
          // were passed correctly. A double requestAnimationFrame still
          // defers the first attempt to after the browser's next two
          // paint/layout passes (keeps the fix from dba2a4c), but the
          // apply itself is now gated on a SIZE CONDITION rather than a
          // frame count: if #map still measures 0x0, it re-checks on the
          // next frame, up to INIT_VIEW_MAX_ATTEMPTS, logging once if
          // that cap is reached and applying anyway (recording that it
          // applied at zero size); if a later frame is ever the first to
          // observe a non-zero size after that, it re-applies once more.
          var initViewAttempts = 0;
          function hasMapSize() {
            var el = document.getElementById('map');
            return !!el && el.clientWidth > 0 && el.clientHeight > 0;
          }
          function applyView() {
            map.invalidateSize();
            map.setView([config.latitude, config.longitude], config.zoom);
          }
          // One-shot recovery: runs AFTER the cap below is exhausted at
          // zero size, bounded by the same named cap rather than polling
          // forever, so a WebView that never reports a size cannot start
          // an unbounded rAF loop.
          function watchForRecovery(attemptsSoFar) {
            if (hasMapSize()) {
              post('init-view: re-applying at first non-zero size');
              applyView();
              return;
            }
            if (attemptsSoFar < INIT_VIEW_MAX_ATTEMPTS) {
              requestAnimationFrame(function () {
                watchForRecovery(attemptsSoFar + 1);
              });
            }
          }
          function applyInitialView() {
            initViewAttempts += 1;
            if (!hasMapSize() && initViewAttempts < INIT_VIEW_MAX_ATTEMPTS) {
              requestAnimationFrame(applyInitialView);
              return;
            }
            if (!hasMapSize()) {
              post(
                'init-view: attempt cap reached at zero size, applying anyway',
              );
              applyView();
              watchForRecovery(0);
              return;
            }
            applyView();
          }
          requestAnimationFrame(function () {
            requestAnimationFrame(applyInitialView);
          });

          // Success heartbeat: makes logcat silence diagnostic rather
          // than ambiguous. A tagged error names the failing layer;
          // init-ok plus a visible map is success; neither, with a
          // blank map, means this script never ran at all.
          post('init-ok');
        } catch (err) {
          post(
            'initLeafletMap: threw: ' +
              (err && err.message ? err.message : String(err)),
          );
        }
      };
    </script>
  </body>
</html>
